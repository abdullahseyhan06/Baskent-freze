<style>
*{box-sizing:border-box} html,body{margin:0;background:#050b12;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
button,input,select,textarea{font:inherit} .app{max-width:1100px;margin:auto} .home{position:relative;overflow:hidden;background:#07111b}
.home>img{display:block;width:100%;height:auto} .hot{position:absolute;border:0;background:transparent;border-radius:18px}
.w{left:3.5%;top:24%;width:45.5%;height:18%} .g{left:50%;top:24%;width:46.5%;height:18%}
.v{left:3.5%;top:43%;width:45.5%;height:18%} .f{left:50%;top:43%;width:46.5%;height:18%}
.m{left:3.5%;top:62%;width:45.5%;height:17%} .n{left:50%;top:62%;width:46.5%;height:17%}
.s{left:3%;top:80%;width:29.5%;height:10.5%} .a{left:34%;top:80%;width:31%;height:10.5%} .h{left:67%;top:80%;width:30%;height:10.5%}
.panel{display:none;position:fixed;z-index:50;inset:0;background:#07111b;padding:18px;overflow:auto} .panel.on{display:block}
.box{max-width:650px;margin:auto} .back{border:0;background:#1b2b3b;color:#fff;padding:11px 17px;border-radius:11px;font-weight:800}
.title{font-size:25px;margin:20px 0 14px} .form{display:grid;gap:11px} .form label{display:grid;gap:6px;color:#c8d3df;font-size:14px}
.form input,.form select,.form textarea{width:100%;padding:13px;border:1px solid #38516a;border-radius:10px;background:#0b1725;color:#fff}
.btn{border:0;border-radius:11px;padding:14px;background:#1775df;color:#fff;font-weight:900} .result{background:#102033;border:1px solid #29415a;border-radius:12px;padding:14px;line-height:1.7}
.geargrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px} .geargrid input{min-width:0}
table{width:100%;border-collapse:collapse;margin-top:10px} td,th{border-bottom:1px solid #29415a;padding:8px;text-align:left;font-size:13px}
@media(max-width:600px){.title{font-size:22px} .geargrid{grid-template-columns:repeat(2,1fr)}}

<div id="panel" class="panel"><div class="box"><button class="back" onclick="closePanel()">← Ana Ekran</button><div id="content"></div></div></div>
<script>
const panel=document.getElementById('panel'), content=document.getElementById('content');
function show(t,b){content.innerHTML='<div class="title">'+t+'</div>'+b;panel.classList.add('on')}
function closePanel(){panel.classList.remove('on')}
function I(id,p=''){return `<input id="${id}" type="number" inputmode="decimal" placeholder="${p}" step="any">`}
function weight(){show('MALZEME AĞIRLIK HESABI',`<div class="form">
<label>Çap (mm)${I('wd','Örn. 50')}</label><label>Boy (mm)${I('wl','Örn. 100')}</label>
<label>Malzeme<select id="rho"><option value="7.85">Çelik — 7,85</option><option value="7.90">Paslanmaz — 7,90</option><option value="2.70">Alüminyum — 2,70</option><option value="8.50">Pirinç — 8,50</option><option value="8.96">Bakır — 8,96</option><option value="7.20">Dökme Demir — 7,20</option></select></label>
<label>Fiyat (TL/kg)${I('wp','0')}</label><label>Fire (%)${I('ws','0')}</label><label>İşleme (%)${I('wi','0')}</label>
<button class="btn" onclick="calcWeight()">HESAPLA</button><div id="wr"></div></div>`)}
function calcWeight(){let d=+wd.value,L=+wl.value,r=+rho.value,p=+wp.value||0,fire=+ws.value||0,proc=+wi.value||0;
if(!(d>0&&L>0)){wr.innerHTML='<div class="result">Çap ve boy girin.</div>';return} let kg=Math.PI*d*d/4*L*r/1e6,kgf=kg*(1+fire/100),mc=kgf*p,total=mc*(1+proc/100);
wr.innerHTML=`<div class="result"><b>Net ağırlık:</b> ${kg.toFixed(3)} kg<br><b>Fire dahil:</b> ${kgf.toFixed(3)} kg<br><b>Malzeme:</b> ${mc.toFixed(2)} TL<br><b>Toplam:</b> ${total.toFixed(2)} TL</div>`}
function gearAdjust(){show('DİŞLİ ÇARK AYARLAMA',`<div class="form"><div class="result">A/B/C/D dişlilerini girin. Aynı fiziksel dişli bir kombinasyonda tekrar kullanılamaz.</div>
<div class="geargrid"><label>A${I('ga')}</label><label>B${I('gb')}</label><label>C${I('gc')}</label><label>D${I('gd')}</label></div>
<button class="btn" onclick="calcGA()">HESAPLA</button><div id="gar"></div></div>`)}
function calcGA(){let x=[+ga.value,+gb.value,+gc.value,+gd.value];if(x.some(v=>v<=0)){gar.innerHTML='<div class="result">Dört dişliyi de girin.</div>';return}
if(new Set(x).size<4){gar.innerHTML='<div class="result">Geçersiz: aynı dişli tekrar kullanılamaz.</div>';return}
gar.innerHTML=`<div class="result"><b>Oran:</b> ${((x[0]*x[2])/(x[1]*x[3])).toFixed(6)}<br>4 farklı dişli ✓</div>`}
function vkwk(){show('VK / WK HESABI',`<div class="form"><label>Çap (mm)${I('vd')}</label><label>Kesme hızı Vc (m/dak)${I('vc')}</label><label>İlerleme f (mm/dev)${I('vf')}</label><button class="btn" onclick="calcVK()">HESAPLA</button><div id="vr"></div></div>`)}
function calcVK(){let d=+vd.value,v=+vc.value,f=+vf.value;if(!(d>0&&v>0)){vr.innerHTML='<div class="result">Çap ve kesme hızını girin.</div>';return}let n=1000*v/(Math.PI*d);vr.innerHTML=`<div class="result"><b>Devir:</b> ${n.toFixed(0)} dev/dak<br><b>İlerleme:</b> ${(f>0?n*f:0).toFixed(1)} mm/dak</div>`}
const gears=[32,54,60,100,67,80,90,88,63,66,77,75,97,137,98,79,83,69,68,72,78,70,71,74,53,64,58,38,73,59,62,57,40,76,56,24,22,47,30,50,25,26,36,28,43,42,45,49,27,44,52,41,61,48,113,120];
function fellow(){show('FELLOW DİŞLİ ÇARK HESABI',`<div class="form"><label>Modül diş sayısı${I('fm')}</label><label>İş diş sayısı${I('fw')}</label><button class="btn" onclick="findFellow()">UYGUN KOMBİNASYONLARI BUL</button><div id="fr"></div></div>`)}
function findFellow(){let M=+fm.value,W=+fw.value;if(!(M>0&&W>0)){fr.innerHTML='<div class="result">İki değeri de girin.</div>';return}
let target=5*M/(3*W), pairs=[];for(let a of gears)for(let c of gears)if(a!==c)pairs.push([a*c,a,c]);let best=[];
for(let b of gears)for(let d of gears)if(b!==d){let den=b*d;for(let q of pairs){if(q[1]===b||q[1]===d||q[2]===b||q[2]===d)continue;let e=Math.abs(q[0]/den-target);if(best.length<8||e<best[best.length-1].e){best.push({a:q[1],b,c:q[2],d,e});best.sort((x,y)=>x.e-y.e);if(best.length>8)best.pop()}}}
fr.innerHTML='<div class="result"><b>Hedef oran:</b> '+target.toFixed(6)+'<table><tr><th>A</th><th>B</th><th>C</th><th>D</th><th>Hata</th></tr>'+best.map(x=>`<tr><td>${x.a}</td><td>${x.b}</td><td>${x.c}</td><td>${x.d}</td><td>${x.e.toFixed(6)}</td></tr>`).join('')+'</table></div>'}
